; ShopHaat — per-directory PHP settings for hosts running PHP as
; FastCGI / PHP-FPM (most cPanel accounts). Mirrors the values in .htaccess,
; which only applies when PHP runs as an Apache module (mod_php).
; post_max_size is kept slightly larger than upload_max_filesize on purpose.
upload_max_filesize = 64M
post_max_size = 68M
