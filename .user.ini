; ShopHaat — PHP settings for hosts running PHP as FastCGI / PHP-FPM (most
; cPanel accounts). Apache with mod_php reads the same values from .htaccess.
;
; The application adds no upload limit of its own; it reports whatever the
; server actually allows. Keep post_max_size slightly above upload_max_filesize.

upload_max_filesize = 64M
post_max_size = 68M
max_file_uploads = 20

; Never render errors to visitors; keep writing them to the log file.
display_errors = Off
log_errors = On

; Session hardening (the application sets these at runtime as well).
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = "Lax"

; Do not expose the PHP version in responses or headers.
expose_php = Off
