<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 40" width="96" height="40" role="img" aria-label="Cash on Delivery">
  <rect x="1" y="1" width="94" height="38" rx="9" fill="#ffffff" stroke="#dfe4ec"/>
  <!-- banknote -->
  <rect x="9" y="11" width="30" height="18" rx="3" fill="#16a34a"/>
  <rect x="12" y="14" width="24" height="12" rx="2" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.2"/>
  <circle cx="24" cy="20" r="4.2" fill="#ffffff"/>
  <circle cx="24" cy="20" r="2" fill="#16a34a"/>
  <!-- delivery box -->
  <path d="M44 15.5 52 11l8 4.5v9L52 29l-8-4.5z" fill="#f59e0b"/>
  <path d="M44 15.5 52 20l8-4.5M52 20v9" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- label -->
  <text x="66" y="18" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="800" fill="#1f2937" letter-spacing=".5">COD</text>
  <text x="66" y="27.5" font-family="Arial, Helvetica, sans-serif" font-size="5.6" font-weight="700" fill="#6b7280" letter-spacing=".3">CASH ON</text>
  <text x="66" y="34" font-family="Arial, Helvetica, sans-serif" font-size="5.6" font-weight="700" fill="#6b7280" letter-spacing=".3">DELIVERY</text>
</svg>
