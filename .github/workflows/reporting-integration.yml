name: Reporting and order timeline integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/9fe3cb2b-shop-haat-otp-system-ai
      - arena/403101d1-shop-haat-otp-system-ai
      - arena/3066d658-shop-haat-otp-system-ai
  pull_request:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression suite and static scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, gd, pdo_sqlite
          coverage: none
      - name: PHP syntax check every file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Static security scan (fails on high or critical)
        run: php tools/security-scan.php --fail-on=high
      - name: Security regression suite
        run: php tests/security-regression.php
      # Pure support-chat logic with no database or network: language/intent
      # routing, verified-fact composition, the AI output guard, secret-safe
      # message shapes and the static CSRF/permission/no-scroll-box wiring.
      - name: AI customer support unit suite
        run: php tests/support-unit.php
      # Real PHP service functions against real PDO SQL (SQLite in this job,
      # MySQL via SH_TEST_MYSQL_DSN elsewhere): one handoff confirmation,
      # silent human-owned follow-ups, no AI/FAQ/fallback, admin reply,
      # explicit Resume AI, takeover, assign/resolve/reopen idempotency.
      - name: Human support handoff integration
        run: php tests/human-support-handoff.php
      # One SMS per genuinely new human-support request (both the button and
      # the message-intent handoff paths), provider acceptance vs rejection,
      # disabled/misconfigured provider never breaking chat, secret-free body
      # and logs, and no duplicate after close/reopen/Resume AI. The outbound
      # carrier is an explicit test transport: this is NOT a live SMS test.
      - name: Human Support Notifications (SMS) integration
        run: php tests/support-sms-notifications.php
      # Real provider-driver code with outbound HTTP stubbed: current TextBee
      # account endpoint, explicit data.success/smsBatchId acceptance, redacted
      # diagnostics, cURL/SSL/HTTP error translation, HTTPS-only generic APIs,
      # custom driver cfg passing and fail-closed offline/Firebase handling.
      - name: SMS transport contract and diagnostics
        run: php tests/support-sms-transport.php
      # Server-side custom URL validation, no-lockout staged -> verified ->
      # applied -> disabled lifecycle, generic 404s for legacy admin paths in
      # isolated PHP subprocesses, and independent endpoint/asset guards.
      - name: Custom Admin Access URL integration
        env:
          SH_TEST_PHP_BIN: php
        run: php tests/admin-access-url.php
      # The shipped CLI token parser is executed with real argv/env/$_GET: the
      # documented cPanel command resolves its token, the old
      # `php cron/backup.php?token=…` form cannot authenticate, the HTTP header
      # still wins over the query string, and a CLI run without a database
      # explains itself instead of exiting silently.
      - name: Cron CLI authentication
        env:
          SH_TEST_PHP_BIN: php
        run: php tests/cron-cli-auth.php
      # The "move the OTP pepper out of the database" button. The first run is a
      # normal account, so every permission check really executes; the second
      # simulates a root-like host (where chmod 0555 does not deny a write) and
      # proves the suite reports those checks BLOCKED by name instead of failing.
      # Both must exit 0 — a blocked check is neither a pass nor a failure.
      - name: Secret migration (permission-enforcing account)
        run: php tests/secrets-migration.php
      - name: "Secret migration (root-like host: BLOCKED classification)"
        env:
          SH_TEST_ASSUME_NO_PERM_ENFORCEMENT: '1'
        run: php tests/secrets-migration.php
      # Drives the real transport against local TLS servers: a matching cert
      # (STARTTLS + AUTH + real submission), a trusted-but-wrong-name cert
      # (must fail at tls_hostname with no AUTH/MAIL), a 535 server (must fail
      # at auth), and a local HTTPS Brevo API stub (valid vs wrong key).
      - name: SMTP and Brevo TLS diagnostics
        run: php tests/smtp-tls-diagnostics.php
      # The Brevo HTTPS API contract, against a local TLS stub that reproduces
      # the reported failure: a key Brevo accepts for transactional email but
      # refuses for GET /v3/account (403 permission_denied). It proves that a
      # 403 on the account resource is reported as a resource permission, not
      # as a broken key or a failed connection; that an SMTP key is never sent
      # to the API endpoint; that a denied send is never reported as success
      # and never retried; and that only an accepted POST /v3/smtp/email counts
      # as a send.
      - name: Brevo API diagnostics and credential isolation
        run: php tests/brevo-api-diagnostics.php
      # Both harnesses drive the REAL rendered markup (tests/page-transition-
      # fixtures.php and tests/slider-fixtures.php, which call the shipped
      # helpers), the real stylesheet and the real script inside jsdom:
      #   - the page transition state machine: first paint, refresh, direct URL,
      #     admin panel, one-shot marker, no stuck overlay, no bfcache replay;
      #   - the homepage slider: crossfade layering, autoplay interval, pause on
      #     a hidden tab / off-screen carousel, reduced motion, image warm-up,
      #     a missing image and the button-free markup;
      #   - the no-autosave rule: typing, pasting, blurring and waiting never
      #     write, the unsaved-changes guard only warns, and the SEO preview
      #     shows long copy in full instead of clipping it;
      #   - the AI provider "Test connection" button: every outcome (connected,
      #     token limit, rejected key, server error, network failure, timeout)
      #     renders in the card and the button always resets.
      # Test-only: the store itself still runs on plain PHP with no Node.js.
      - name: Front-end behaviour harnesses (page transition, slider, no-autosave, provider test, support chat, fixed-height chat composer, Admin URL preview, compact Settings, admin courier/AI provider UI/UX source audit)
        env:
          SH_PT_REQUIRE_JSDOM: '1'
          SH_SLIDER_REQUIRE_JSDOM: '1'
          SH_NA_REQUIRE_JSDOM: '1'
          SH_PT2_REQUIRE_JSDOM: '1'
          SH_SC_REQUIRE_JSDOM: '1'
        run: |
          npm install --no-save --no-package-lock jsdom@26.1.0
          node tests/page-transition-behavior.mjs
          node tests/slider-behavior.mjs
          node tests/no-autosave-behavior.mjs
          node tests/provider-test-behavior.mjs
          node tests/support-chat-behavior.mjs
          node tests/support-chat-optimistic-behavior.mjs
          node tests/support-chat-composer-behavior.mjs
          node tests/support-admin-inbox-behavior.mjs
          node tests/admin-access-regression.mjs
          node tests/admin-access-preview-behavior.mjs
          node tests/support-settings-ui-behavior.mjs
          node tests/ui-ux-audit.mjs
      # ====================================================================
      # SHOP HAAT — COMPLETE PRODUCT MANAGEMENT & IMAGE GALLERY UPGRADE
      # Explicit 16-case functional acceptance matrix. The PHP/SQL suite drives
      # the real helpers against PDO SQLite; the rendered/jsdom suite drives the
      # real PHP templates, stylesheet and scripts. Both are fixtures, NOT live
      # MySQL, a deployed store, a real browser/device or production parity.
      # P01 additive migration; legacy one-image products, URLs and the
      #     physical/digital fulfilment ENUM stay compatible.
      # P02 fresh-install schema creates dictionary tables, cart_items.variant,
      #     the per-variant unique key and idempotent type/colour starters.
      # P03 admin create saves 1–5 ordered images; products.image follows the
      #     first/primary image.
      # P04 zero-image new products and >5-image submissions are rejected with
      #     no orphan uploads.
      # P05 secure 3 MB, MIME and image-dimension validation; a bad file rejects
      #     the whole gallery atomically.
      # P06 admin edit replaces, removes, reorders and adds images with local
      #     previews and deferred old-file cleanup.
      # P07 brands, merchandising types and common colour swatches support
      #     create/edit/hide and usage-protected delete.
      # P08 structured common and custom colours persist and reopen in the
      #     product editor and storefront.
      # P09 the cart API validates the selected colour and defaults to the first
      #     real available option.
      # P10 two colours create distinct cart lines, share product stock, and
      #     update/remove/clear by variant.
      # P11 guest-cart merge preserves variants and keeps a legacy pre-migration
      #     product-only cart line working.
      # P12 checkout/order snapshots and customer, admin and retry displays keep
      #     the selected colour.
      # P13 notification image captions and order text include the saved colour
      #     snapshot.
      # P14 an admin product save is all-or-nothing: DB rollback on failure and
      #     old photos are deleted only after commit.
      # P15 AI Auto Work, SEO structured data, product cards, legacy one-image
      #     products and empty conditional tabs remain compatible.
      # P16 the customer gallery is manual (buttons, thumbs, swipe), with no
      #     autoplay/timers, no cropping/stretching, and a live SEO primary-image
      #     preview; admin scripts are actually loaded.
      # ====================================================================
      - name: Product management PHP/SQL and rendered JS functional suites (16 cases)
        env:
          SH_PM_REQUIRE_JSDOM: '1'
          SH_TEST_PHP_BIN: php
        run: |
          php tests/product-management-integration.php
          php tests/product-management-render.php >/dev/null
          node tests/product-management-behavior.mjs
      - name: Confirm no live credentials are tracked
        run: |
          if git ls-files --error-unmatch config/database.php >/dev/null 2>&1; then
            echo "::error::config/database.php is tracked by git"
            exit 1
          fi
          echo "config/database.php is not tracked."

  reporting-integration:
    name: PHP and MySQL reports and timeline workflow
    needs: security-regression
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: shophaat_reporting_test
          MYSQL_USER: shophaat_test
          MYSQL_PASSWORD: shophaat_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, dom, libxml
          coverage: none
      - name: Configure the isolated test database
        run: |
          cat > config/database.php <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1',
              'name' => 'shophaat_reporting_test',
              'user' => 'shophaat_test',
              'pass' => 'shophaat_test_password',
              'port' => 3306,
              'charset' => 'utf8mb4',
          ];
          PHP
          touch config/installed.lock
      # Installer seeding, through the same function the setup form calls: a
      # demo-OFF install creates structure and essential settings only, a demo-ON
      # install creates the starter catalogue exactly once, a self-chosen
      # administrator password is stored only as a hash and verified with the
      # exact bytes typed, and a repeated install can never reset an existing
      # account or delete real records. It leaves the disposable database empty
      # again for the reporting test below.
      - name: Installer seeding decision (demo data on and off)
        run: php tests/installer-demo-data.php
      # Real MySQL/InnoDB evidence for P01/P02/P10/P15: canonical fresh
      # schema, a simulated pre-upgrade store, the additive migration,
      # dictionary starters, variant unique key, two colour lines for one
      # product and the legacy primary-image snapshot. It drops the disposable
      # tables again because the reporting suite requires an empty database.
      - name: Product management migration and colour-variant key against MySQL
        run: php tests/product-management-mysql.php
      - name: Exercise checkout, payment verification, reports, order timelines, and session recovery
        run: php tests/reporting-integration.php
      - name: Exercise session expiry through customer HTTP routes
        run: bash tests/session-expiration-http.sh
      # The real authentication pages over real HTTP: they render without a PHP
      # diagnostic, the recovery flow runs against a capture SMTP server (the
      # six-digit code is read out of the delivered message, a wrong code is
      # refused, the used code cannot be reused, only the new password signs in,
      # and the change notification is really accepted), an unconfigured store
      # says so instead of claiming a send, the reply is identical for an
      # address that exists and one that does not, and the admin email screens
      # never echo the stored SMTP password.
      - name: Email pages and the recovery flow over HTTP
        run: bash tests/email-pages-http.sh
      # The email system, end to end: a real PHPMailer submission against a
      # capture SMTP server on loopback (submission, AUTH, UTF-8, both MIME
      # alternatives, honest failure categorisation) and the whole challenge
      # lifecycle in MySQL (hashed-only storage, expiry, attempt lock, single
      # use, resend cooldown, rate limits, purpose isolation, cleanup), plus the
      # signed provider webhook and the retry policy. No provider and no
      # credentials are needed, and nothing fakes a delivery: a message counts
      # as sent only when the SMTP server accepts it.
      - name: Email delivery, verification codes and webhook
        run: php tests/email-system.php
      # The proof the browser cannot give: the same function the save endpoint
      # calls, against real MySQL. It asserts that every generated field lands
      # in its column (description, specifications, features, SEO, alt text),
      # that the category relationship, tags and gallery are written, that the
      # same draft token can never create a second product, that a forced
      # database failure rolls the whole save back, that the retry then
      # succeeds, that validation refuses a missing price/category/negative
      # stock, and that the saved row is visible to the storefront queries and
      # the Small/Medium/Large category card. It recreates its own tables in
      # the disposable database and runs last, so no later step depends on its state.
      # Real MySQL proof for the courier work: the additive
      # courier_test_results table, the seven states, configuration-incomplete
      # vs unsupported, append-only history, the cascade on courier deletion and
      # the additive AI test columns on an old ai_providers table. No provider
      # is called, so no credential and no network access is needed.
      - name: Courier connection tests and additive schema
        run: php tests/courier-connection-tests.php
      # SEO copy is editorial, not fixed-width. This upgrades a simulated
      # VARCHAR(190/300) install in place, proves the old values survive, writes
      # a title longer than 60 characters and a description longer than 160
      # through the same data layer the admin form uses, and reads both back
      # byte-for-byte from products, categories and seo_pages.
      - name: SEO title and description length
        run: php tests/seo-content-length.php
      - name: AI Auto Work full-product save against MySQL
        run: php tests/product-ai-save.php
      # AI customer support against real MySQL, intentionally with a configured
      # but unreachable AI provider: persistent multilingual conversations,
      # verified product/order tools, both-factor guest order authorization,
      # cross-customer isolation, idempotent sends, rate limits, handoff and
      # takeover/resume, retention purge, and honest deterministic fallback.
      # It runs last because it resets its own support tables in the disposable
      # test database; no external provider or live credential is used.
      - name: AI customer support end-to-end against MySQL
        run: php tests/support-system.php
      # MySQL-only behaviour that a SQLite mirror cannot prove: a fresh install of
      # all 50 tables on InnoDB, an upgrade from a pre-migration store, the unique
      # TrxID index (including the duplicate-history case that must postpone the
      # ALTER instead of failing a customer checkout), rollback, row locking,
      # order ownership and notification idempotency.
      # It runs last because it drops and recreates the disposable tables. It
      # refuses any database whose name does not look like a test database.
      # This step is required: it passed on MySQL 8.0 (run 43621578351) and a
      # regression must fail the build.
      - name: MySQL integration (schema, migration, locking, idempotency)
        env:
          SH_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=shophaat_reporting_test;charset=utf8mb4'
          SH_TEST_MYSQL_USER: shophaat_test
          SH_TEST_MYSQL_PASS: shophaat_test_password
          SH_TEST_MYSQL_ALLOW_DROP: '1'
        run: php tests/mysql-integration.php
      # The rehearsal this project has never been able to run: the application
      # creates a real backup of the disposable store, the tool imports it into a
      # NEW scratch database, verifies tables/indexes/relationships/settings and a
      # representative order, points the application at the restored copy and asks
      # it to read the data, then drops the scratch database. The scratch database
      # is created by root because the application account is granted its own
      # database only — as on shared hosting. The refusal matrix (missing dump,
      # empty dump, a .gz that is not gzip, a dump with no tables, a production
      # name, the live name) runs in the same suite.
      - name: Backup to restore rehearsal against a scratch database
        env:
          SH_TEST_PHP_BIN: php
          SH_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=shophaat_reporting_test;charset=utf8mb4'
          SH_TEST_MYSQL_USER: shophaat_test
          SH_TEST_MYSQL_PASS: shophaat_test_password
          SH_TEST_MYSQL_ROOT_USER: root
          SH_TEST_MYSQL_ROOT_PASS: root_test_password
        run: php tests/restore-rehearsal.php

  # ========================================================================
  # MariaDB is a different engine, not a different version of MySQL:
  # information_schema details, index limits, NOWAIT support and duplicate-key
  # behaviour after a rollback all differ. cPanel hosts ship either one, so the
  # same eleven-scenario suite runs here against MariaDB 10.6.
  # ========================================================================
  mariadb-integration:
    name: MariaDB 10.6 engine suite
    needs: security-regression
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: shophaat_staging_test
          MARIADB_USER: shophaat_test
          MARIADB_PASSWORD: shophaat_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, dom, libxml
      # Same suite, different engine: fresh install of all 50 tables, the
      # upgrade path from a pre-migration store, the unique TrxID index (and the
      # duplicate-history case that must postpone the ALTER), rollback, row
      # locking, OTP replay/expiry, order ownership, notification idempotency and
      # backup metadata. The engine and version are printed in the output, so a
      # MariaDB result can never be quoted as a MySQL result or the reverse.
      - name: MariaDB engine suite (schema, migration, locking, idempotency)
        env:
          SH_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=shophaat_staging_test;charset=utf8mb4'
          SH_TEST_MYSQL_USER: shophaat_test
          SH_TEST_MYSQL_PASS: shophaat_test_password
          SH_TEST_MYSQL_ALLOW_DROP: '1'
        run: php tests/mysql-integration.php

  # ========================================================================
  # The only environment in this project that has a real browser, a real web
  # server and a real database at the same time. Chromium (Playwright) drives the
  # storefront and the admin panel against `php -S` and a disposable MySQL store
  # seeded through the application's own installer path.
  #
  # It checks what only a browser can: console errors, JavaScript exceptions,
  # failed requests, CSP violation reports, whether gallery images really decode
  # (naturalWidth > 0), whether the gallery controls actually change state, and
  # horizontal overflow at a 390x844 phone viewport. Screenshots of each flow are
  # uploaded as an artifact.
  # ========================================================================
  browser-regression:
    name: Real browser regression (Chromium, MySQL, php -S)
    needs: security-regression
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: shophaat_browser_test
          MYSQL_USER: shophaat_test
          MYSQL_PASSWORD: shophaat_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, dom, libxml, fileinfo, gd, curl
      - name: Point the checkout at the disposable database
        run: |
          php -r 'file_put_contents("config/database.php", "<?php\nreturn " . var_export([            "host" => "127.0.0.1", "port" => 3306, "name" => "shophaat_browser_test",            "user" => "shophaat_test", "pass" => "shophaat_test_password",            "charset" => "utf8mb4"], true) . ";\n");'
          php -l config/database.php
      - name: Seed the store through the application installer path
        env:
          SH_BROWSER_SEED: '1'
          SH_BROWSER_HOST: 127.0.0.1:8080
        run: php tests/browser/seed.php
      - name: Start the PHP web server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.php >/tmp/home.html; then break; fi
            sleep 1
          done
          head -c 300 /tmp/home.html; echo
          ! grep -qi "fatal error\|uncaught" /tmp/home.html
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Browser regression (storefront, admin, mobile, CSP)
        env:
          SH_BROWSER_BASE_URL: http://127.0.0.1:8080
          SH_BROWSER_ADMIN_PASSWORD: AdminTest!2026
          SH_BROWSER_CUSTOMER_PASSWORD: Customer!2026
        run: node tests/browser/smoke.mjs
      - name: Upload screenshots and the PHP server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-artifacts
          path: |
            tests/browser/artifacts/
            /tmp/php-server.log
          if-no-files-found: warn
